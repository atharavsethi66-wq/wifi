name: Build iOS (Unsigned SideStore)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned iOS App
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          # Find available Xcode 16 paths and select the first one.
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | head -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting Xcode from: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "Xcode 16 app not found, using default selected developer directory"
          fi
          
          # Print the active Xcode version and path
          xcodebuild -version
          xcode-select -p

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: |
          # 1. Dynamically extract the exact tauri crate version from Cargo.lock
          TAURI_VERSION=$(grep -A 2 'name = "tauri"' src-tauri/Cargo.lock | grep 'version =' | head -n 1 | cut -d '"' -f 2)
          echo "Detected Tauri crate version: $TAURI_VERSION"
          
          # 2. Install the exact same version of tauri-cli to guarantee compatibility
          cargo install tauri-cli --version "$TAURI_VERSION"
          cargo tauri --version

      - name: Clean Temporary Tauri State and Environment
        run: |
          echo "Cleaning temporary Tauri server address files..."
          # Delete any stale server address files from common temporary directories
          rm -f $TMPDIR/*_server-addr
          rm -f /tmp/*_server-addr
          rm -f $RUNNER_TEMP/*_server-addr
          rm -f ~/Library/Caches/*-server-addr
          rm -rf ~/Library/Application\ Support/tauri
          rm -rf ~/Library/Caches/tauri
          rm -rf ~/.config/tauri
          rm -rf ~/.local/share/tauri
          
          # Unset conflicting Tauri environment variables and overrides
          echo "Unsetting conflicting environment variables..."
          unset $(env | grep -o '^TAURI_[^=]*') || true
          unset PRODUCT_BUNDLE_IDENTIFIER
          unset BUNDLE_IDENTIFIER
          unset DEVELOPMENT_TEAM
          unset PROVISIONING_PROFILE

      - name: Initialize iOS Platform
        run: |
          # CI=true makes cargo tauri ios init run in non-interactive mode.
          CI=true cargo tauri ios init

      - name: Inspect and Verify Build Rust Code Script
        run: |
          PBXPROJ_PATH=$(find src-tauri/gen/apple -name "project.pbxproj" | head -n 1)
          if [ -z "$PBXPROJ_PATH" ]; then
            echo "::error::Could not find project.pbxproj file!"
            exit 1
          fi
          
          echo "Inspecting Build Rust Code script in project.pbxproj..."
          grep -A 5 -B 2 "tauri ios xcode-script" "$PBXPROJ_PATH" || true
          
          # Get correct app identifier from tauri.conf.json
          APP_IDENTIFIER=$(jq -r '.app.identifier // .identifier' src-tauri/tauri.conf.json)
          echo "Expected App Identifier: $APP_IDENTIFIER"
          
          # Ensure there are no unexpected bundle ID references like com.immo.io
          # (Perform a dynamic regex find-and-replace to clean up any incorrect placeholders)
          echo "Ensuring project files match the correct app identifier..."
          find src-tauri/gen/apple -type f -exec sed -i '' "s/com.immo.io/$APP_IDENTIFIER/g" {} + 2>/dev/null || true
          find src-tauri/gen/apple -type f -exec sed -i '' "s/com.goor/$APP_IDENTIFIER/g" {} + 2>/dev/null || true
          
          # Verify that com.immo.io is not present in the generated files
          if grep -q "com.immo.io" "$PBXPROJ_PATH"; then
            echo "::error::Found unexpected reference to 'com.immo.io' in the generated Xcode project!"
            exit 1
          fi

      - name: Build iOS Application (Unsigned)
        run: |
          # 1. Locate Xcode project/workspace paths dynamically
          WORKSPACE_PATH=$(find src-tauri/gen/apple -name "*.xcworkspace" | head -n 1)
          PROJECT_PATH=$(find src-tauri/gen/apple -name "*.xcodeproj" | head -n 1)
          PBXPROJ_PATH=$(find src-tauri/gen/apple -name "project.pbxproj" | head -n 1)
          
          # Determine correct project configuration paths
          BUILD_TARGET_PATH=""
          if [ -n "$WORKSPACE_PATH" ]; then
            BUILD_TARGET_PATH="$WORKSPACE_PATH"
          else
            BUILD_TARGET_PATH="$PROJECT_PATH"
          fi
          
          # 2. Print required diagnostics
          echo "=== Xcode & Active Environment ==="
          xcodebuild -version
          xcode-select -p
          
          echo "=== Tauri CLI Version ==="
          cargo tauri --version || cargo-tauri --version || tauri --version || true
          
          echo "=== Tauri Info ==="
          cargo tauri info || true
          
          echo "=== Relevant Environment Variables ==="
          env | grep TAURI_ || true
          
          echo "=== Generated Xcode Script Command ==="
          if [ -n "$PBXPROJ_PATH" ]; then
            grep -o 'tauri ios xcode-script[^"]*' "$PBXPROJ_PATH" || grep -o 'tauri ios xcode-script[^;]*' "$PBXPROJ_PATH" || true
          else
            echo "project.pbxproj not found"
          fi
          
          # 3. Resolve scheme and execute xcodebuild
          if [ -z "$WORKSPACE_PATH" ]; then
            if [ -z "$PROJECT_PATH" ]; then
              echo "::error::Could not find any .xcodeproj or .xcworkspace file!"
              exit 1
            fi
            
            # Find the iOS-specific scheme dynamically
            SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" | sed -n '/Schemes:/,$p' | tail -n +2 | awk '{$1=$1;print}' | grep -i "ios" | head -n 1)
            if [ -z "$SCHEME_NAME" ]; then
              SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" | sed -n '/Schemes:/,$p' | tail -n +2 | awk '{$1=$1;print}' | head -n 1)
            fi
            
            echo "Executing xcodebuild command:"
            echo "xcodebuild -project \"$PROJECT_PATH\" -scheme \"$SCHEME_NAME\" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY=\"\" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build"
            
            xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            # Find the iOS-specific scheme dynamically
            SCHEME_NAME=$(xcodebuild -list -workspace "$WORKSPACE_PATH" | sed -n '/Schemes:/,$p' | tail -n +2 | awk '{$1=$1;print}' | grep -i "ios" | head -n 1)
            if [ -z "$SCHEME_NAME" ]; then
              SCHEME_NAME=$(xcodebuild -list -workspace "$WORKSPACE_PATH" | sed -n '/Schemes:/,$p' | tail -n +2 | awk '{$1=$1;print}' | head -n 1)
            fi
            
            echo "Executing xcodebuild command:"
            echo "xcodebuild -workspace \"$WORKSPACE_PATH\" -scheme \"$SCHEME_NAME\" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY=\"\" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build"
            
            xcodebuild \
              -workspace "$WORKSPACE_PATH" \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Locate and Package Artifacts
        run: |
          # 1. Dynamically find the built .app bundle in the build products folder.
          # Xcode builds place the release product in a subfolder of Build/Products/Release-iphoneos/
          APP_PATH=$(find src-tauri/gen/apple/build -path "*/Release-iphoneos/*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find the compiled .app bundle inside 'src-tauri/gen/apple/build'!"
            exit 1
          fi
          
          echo "Found compiled .app at: $APP_PATH"
          
          # Verify .app exists and contains files
          if [ ! -d "$APP_PATH" ] || [ -z "$(ls -A "$APP_PATH")" ]; then
            echo "::error::The .app bundle is empty or invalid!"
            exit 1
          fi
          
          # 2. Package .app into an unsigned .ipa container for SideStore
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # Verify Payload contains the app
          APP_NAME=$(basename "$APP_PATH")
          if [ ! -d "Payload/$APP_NAME" ]; then
            echo "::error::Failed to copy .app bundle to Payload directory!"
            exit 1
          fi
          
          # Create zip archive (IPA) preserving symlinks
          zip -y -r wifi-app-unsigned.ipa Payload
          
          # 3. Verify .ipa exists and is not empty
          if [ ! -f wifi-app-unsigned.ipa ] || [ ! -s wifi-app-unsigned.ipa ]; then
            echo "::error::The generated .ipa file is empty or missing!"
            exit 1
          fi
          
          echo "Successfully verified and packaged wifi-app-unsigned.ipa."
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: wifi-app-unsigned-ipa
          path: wifi-app-unsigned.ipa
          if-no-files-found: error

      - name: Upload raw .app Bundle (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: wifi-app-bundle
          path: ${{ env.APP_PATH }}
          if-no-files-found: error
